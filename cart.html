<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cart | Lumieres Atelier</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"></head><body>
<section id="header"><a href="index.html"><img src="img/logo.png" class="logo" alt="Lumieres Atelier"></a><div><ul id="navbar"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="blog.html">Blog</a></li><li><a href="about.html">About</a></li><li><a href="contect.html">Contact</a></li><li id="Ig-bag"><a class="active" href="cart.html"><i class="fa fa-shopping-bag" style="font-size:36px"></i><span class="cart-count">0</span></a></li><a href="#" id="close"><i class="far fa-times"></i></a></ul></div><div id="mobile"><a href="cart.html"><i class="fa fa-shopping-bag" style="font-size:36px"></i><span class="cart-count">0</span></a><i id="bar" class="fas fa-outdent"></i></div></section>
<section id="page-header"><h2>Your Cart</h2><p>Review your candles before checkout.</p></section>
<section class="section-p1 cart-page"><div id="cart-items"></div><div class="cart-summary"><h3>Order summary</h3><p>Total: <strong id="cart-total">0L</strong></p><form id="checkout-form"><input name="name" required placeholder="Name and surname"><input name="phone" required placeholder="Phone"><input name="email" type="email" placeholder="Email"><input name="address" required placeholder="Delivery address"><textarea name="note" placeholder="Order note"></textarea><button class="normal" type="submit">Place order</button></form><p id="checkout-message"></p></div></section>
<script src="config.js"></script><script src="products.js"></script><script src="app.js"></script><script src="script.js"></script><script>
function renderCart(){const cart=getCart(),wrap=document.getElementById('cart-items');if(!cart.length){wrap.innerHTML='<p>Your cart is empty. <a href="shop.html">Go to shop</a>.</p>';document.getElementById('cart-total').textContent='0L';return;}wrap.innerHTML=cart.map((x,i)=>`<div class="cart-row"><img src="${x.image}" alt="${x.name}"><div><h4>${x.name}</h4><small>${x.scent||''}</small><p>${money(x.price)} × ${x.quantity}</p></div><button data-remove="${i}" class="remove-cart">Remove</button></div>`).join('');document.getElementById('cart-total').textContent=money(cart.reduce((s,x)=>s+x.price*x.quantity,0));wrap.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const c=getCart();c.splice(Number(b.dataset.remove),1);saveCart(c);renderCart();});}
document.addEventListener('DOMContentLoaded',()=>{renderCart();document.getElementById('checkout-form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('checkout-message'),cart=getCart();if(!cart.length){msg.textContent='Cart is empty.';return;}const fd=new FormData(e.target);const customer=Object.fromEntries(fd.entries());try{const order=await api('/api/orders',{method:'POST',body:JSON.stringify({customer,items:cart})});msg.textContent=`Order ${order.id} was created successfully.`;saveCart([]);renderCart();e.target.reset();}catch(err){msg.textContent='Backend is not connected yet. Deploy the API and set its URL in config.js.';}};});
</script></body></html>
