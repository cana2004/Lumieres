<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Product | Lumieres Atelier</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"></head><body>
<section id="header"><a href="index.html"><img src="img/logo.png" class="logo" alt="Lumieres Atelier"></a><div><ul id="navbar"><li><a href="index.html">Home</a></li><li><a class="active" href="shop.html">Shop</a></li><li><a href="blog.html">Blog</a></li><li><a href="about.html">About</a></li><li><a href="contect.html">Contact</a></li><li id="Ig-bag"><a href="cart.html"><i class="fa fa-shopping-bag" style="font-size:36px"></i><span class="cart-count">0</span></a></li><a href="#" id="close"><i class="far fa-times"></i></a></ul></div><div id="mobile"><a href="cart.html"><i class="fa fa-shopping-bag" style="font-size:36px"></i><span class="cart-count">0</span></a><i id="bar" class="fas fa-outdent"></i></div></section>
<section id="prodetails" class="section-p1"><div class="single-pro-image"><img src="" width="100%" id="MainImg" alt=""><div class="small-img-group" id="small-img-group"></div></div><div class="single-pro-details"><h6>Home / Candle</h6><h4 id="product-name">Loading...</h4><h2 id="product-price"></h2><select id="product-scents"></select><input id="product-qty" type="number" value="1" min="1" step="1"><button id="add-product-cart" class="normal">Add to Cart</button><h4>Product Details</h4><span id="product-desc"></span></div></section>
<script src="config.js"></script><script src="products.js"></script><script src="app.js"></script><script src="script.js"></script><script>
document.addEventListener('DOMContentLoaded', async()=>{const id=new URLSearchParams(location.search).get('id');const product=await getProduct(id);if(!product){document.querySelector('.single-pro-details').innerHTML='<p>Product not found.</p>';return;}document.getElementById('product-name').textContent=product.name;document.getElementById('product-price').textContent=money(product.price);document.getElementById('product-desc').textContent=product.description;document.getElementById('MainImg').src=product.images?.[0]||product.image;const select=document.getElementById('product-scents');(product.scents||['']).forEach(x=>select.add(new Option(x,x)));const group=document.getElementById('small-img-group');(product.images||[product.image]).forEach(src=>{const d=document.createElement('div');d.className='small-img-col';d.innerHTML=`<img src="${src}" width="100%" class="small-img" alt="${product.name}">`;d.onclick=()=>document.getElementById('MainImg').src=src;group.appendChild(d);});document.getElementById('add-product-cart').onclick=()=>addToCart(product,Math.max(1,Number(document.getElementById('product-qty').value)||1),select.value);});
</script></body></html>
